name: Deploy customer to DEV

on:
  workflow_dispatch:
    inputs:
      customer:
        description: Customer to deploy.
        required: true
        type: choice
        options:
          - demo-a
          - demo-b

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-central-1
  TF_IN_AUTOMATION: "true"
  TF_VAR_aws_region: eu-central-1
  TF_VAR_customer_key: ${{ inputs.customer }}

jobs:
  deploy:
    name: Deploy ${{ inputs.customer }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Show GitHub OIDC claims
        shell: bash
        run: |
          oidc_response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          oidc_token="$(jq --exit-status --raw-output '.value' <<<"$oidc_response")"
          oidc_payload="${oidc_token#*.}"
          oidc_payload="${oidc_payload%%.*}"
          oidc_payload="${oidc_payload//-/+}"
          oidc_payload="${oidc_payload//_/\/}"

          case $((${#oidc_payload} % 4)) in
            0) ;;
            2) oidc_payload="${oidc_payload}==" ;;
            3) oidc_payload="${oidc_payload}=" ;;
            *) echo "Invalid OIDC token payload encoding." >&2; exit 1 ;;
          esac

          printf '%s' "$oidc_payload" \
            | base64 --decode \
            | jq --exit-status '{iss: .iss, aud: .aud, sub: .sub}'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: eu-central-1
          retry-max-attempts: 1
          role-session-name: github-amazon-connect-lab-dev
          role-to-assume: arn:aws:iam::854010287302:role/github-amazon-connect-lab-dev

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.15.8"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize customer backend
        run: |
          terraform init -input=false \
            -backend-config="bucket=amazon-connect-tfstate-854010287302-eu-central-1" \
            -backend-config="key=customers/${{ inputs.customer }}/dev/terraform.tfstate"
        working-directory: terraform

      - name: Validate configuration
        run: terraform validate -no-color
        working-directory: terraform

      - name: Plan deployment
        run: terraform plan -input=false -no-color -out=tfplan
        working-directory: terraform

      - name: Apply deployment
        run: terraform apply -input=false -auto-approve tfplan
        working-directory: terraform
